name: Deploy SOFUMER to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Lint, Build & Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  deploy:
    name: Deploy to Cloudflare (sofumer-app)
    needs: ci
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare credentials & D1 readiness
        id: cf_ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets. Configure both secrets to deploy sofumer-app."
            exit 1
          fi
          DB_NAME=$(node -e "const fs=require('fs');const raw=fs.readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/gm,'');const cfg=JSON.parse(raw);console.log(cfg.d1_databases?.[0]?.database_name || 'sofumer-db');")
          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"
          if ! npx --no-install wrangler d1 list; then
            echo "::error::Cloudflare D1 API access failed. Ensure CLOUDFLARE_API_TOKEN has 'Account > Workers Scripts: Edit' and 'Account > D1: Edit' permissions, and CLOUDFLARE_ACCOUNT_ID is correct."
            tail -n 60 ~/.config/.wrangler/logs/*.log 2>/dev/null || true
            exit 1
          fi
      - name: Deploy Cloudflare Worker, Assets & Auto-Provision D1
        env:
          CI: 'true'
        run: |
          if ! npx --no-install wrangler deploy --x-provision; then
            echo "::error::Cloudflare Worker deploy failed. Ensure CLOUDFLARE_API_TOKEN has 'Account > Workers Scripts: Edit' and 'Account > D1: Edit' permissions."
            tail -n 60 ~/.config/.wrangler/logs/*.log 2>/dev/null || true
            exit 1
          fi
      - name: Apply D1 Migrations
        env:
          CI: 'true'
        run: |
          DB_NAME="${{ steps.cf_ready.outputs.db_name }}"
          if ! npx --no-install wrangler d1 info "$DB_NAME" >/dev/null 2>&1; then
            echo "D1 database '$DB_NAME' not found yet; creating it now..."
            if ! npx --no-install wrangler d1 create "$DB_NAME"; then
              echo "::error::Failed to create D1 database '$DB_NAME'. Ensure CLOUDFLARE_API_TOKEN includes 'Account > D1: Edit'."
              tail -n 60 ~/.config/.wrangler/logs/*.log 2>/dev/null || true
              exit 1
            fi
          fi
          if ! npx --no-install wrangler d1 migrations apply "$DB_NAME" --remote -y; then
            echo "::error::D1 migration failed for '$DB_NAME'."
            tail -n 60 ~/.config/.wrangler/logs/*.log 2>/dev/null || true
            exit 1
          fi
