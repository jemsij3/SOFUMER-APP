name: Deploy SOFUMER to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Lint, Build & Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  deploy:
    name: Deploy to Cloudflare (sofumer-app)
    needs: ci
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare credentials & D1 readiness
        id: cf_ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets. Configure both secrets to deploy sofumer-app."
            exit 1
          fi
          WORKER_NAME=$(node -e "const fs=require('fs');const raw=fs.readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/gm,'');const cfg=JSON.parse(raw);if(cfg.name!=='sofumer-app'){console.error('Expected Worker name sofumer-app, got '+cfg.name);process.exit(1);}console.log(cfg.name);")
          DB_NAME=$(node -e "const fs=require('fs');const raw=fs.readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/gm,'');const cfg=JSON.parse(raw);console.log(cfg.d1_databases?.[0]?.database_name || 'sofumer-db');")
          echo "worker_name=$WORKER_NAME" >> "$GITHUB_OUTPUT"
          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"
          if ! npx --no-install wrangler d1 list >/dev/null; then
            echo "::error::Cloudflare D1 API access failed. Ensure CLOUDFLARE_API_TOKEN has 'Account > Workers Scripts: Edit' and 'Account > D1: Edit' permissions, and CLOUDFLARE_ACCOUNT_ID matches your account."
            exit 1
          fi
      - name: Deploy Worker sofumer-app (preserving dashboard vars & secrets)
        env:
          CI: 'true'
          SECRET_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          SECRET_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SECRET_ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          SECRET_ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          SECRET_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          SECRET_CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          SECRET_CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SECRET_MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
        run: |
          SECRETS_FILE=".wrangler-ci-secrets.json"
          cleanup() {
            rm -f "$SECRETS_FILE"
          }
          trap cleanup EXIT

          HAS_SECRETS=$(node -e "
            const fs = require('fs');
            const keys = [
              'TELEGRAM_BOT_TOKEN',
              'TELEGRAM_WEBHOOK_SECRET',
              'JWT_SECRET',
              'ADMIN_TELEGRAM_IDS',
              'ADMIN_TELEGRAM_ID',
              'CLOUDINARY_CLOUD_NAME',
              'CLOUDINARY_API_KEY',
              'CLOUDINARY_API_SECRET',
              'MINI_APP_URL'
            ];
            const out = {};
            for (const k of keys) {
              const v = process.env['SECRET_' + k];
              if (typeof v === 'string' && v.trim() !== '') {
                out[k] = v;
              }
            }
            const names = Object.keys(out);
            if (names.length > 0) {
              fs.writeFileSync('$SECRETS_FILE', JSON.stringify(out), { mode: 0o600 });
              console.error('Syncing ' + names.length + ' non-empty GitHub secret(s) additively: ' + names.join(', '));
              console.log('true');
            } else {
              console.error('No optional GitHub secrets set; preserving existing Cloudflare Dashboard variables and secrets.');
              console.log('false');
            }
          ")

          if [ "$HAS_SECRETS" = "true" ]; then
            npx --no-install wrangler deploy --name "${{ steps.cf_ready.outputs.worker_name }}" --keep-vars --x-provision --secrets-file "$SECRETS_FILE"
          else
            npx --no-install wrangler deploy --name "${{ steps.cf_ready.outputs.worker_name }}" --keep-vars --x-provision
          fi
      - name: Apply D1 Migrations
        env:
          CI: 'true'
        run: |
          DB_NAME="${{ steps.cf_ready.outputs.db_name }}"
          if ! npx --no-install wrangler d1 info "$DB_NAME" >/dev/null 2>&1; then
            echo "D1 database '$DB_NAME' not found yet; creating it now..."
            if ! npx --no-install wrangler d1 create "$DB_NAME"; then
              echo "::error::Failed to create D1 database '$DB_NAME'. Ensure CLOUDFLARE_API_TOKEN includes 'Account > D1: Edit'."
              exit 1
            fi
          fi
          set +e
          MIG_OUT=$(npx --no-install wrangler d1 migrations apply "$DB_NAME" --remote -y 2>&1)
          MIG_STATUS=$?
          set -e
          echo "$MIG_OUT"
          if [ $MIG_STATUS -ne 0 ]; then
            if echo "$MIG_OUT" | grep -qi "duplicate column name"; then
              echo "::warning::D1 migration hit an already-applied column (added by runtime ensureD1Schema). Verifying 0008 schema objects..."
              if npx --no-install wrangler d1 execute "$DB_NAME" --remote -y --command "SELECT deleted_at FROM shops LIMIT 1; SELECT is_protected, is_archived FROM admin_audit_logs LIMIT 1; SELECT is_hidden FROM conversation_participants LIMIT 1; SELECT log_id FROM admin_audit_log_archives LIMIT 1;" >/dev/null 2>&1; then
                echo "Verified 0008 schema columns and tables already exist on $DB_NAME. Recording migration 0008 and re-checking pending migrations..."
                npx --no-install wrangler d1 execute "$DB_NAME" --remote -y --command "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0008_shop_management_and_audit_archive.sql');"
                npx --no-install wrangler d1 migrations apply "$DB_NAME" --remote -y
              else
                echo "::error::D1 migration failed with duplicate column name and verification of 0008 schema objects failed."
                exit 1
              fi
            else
              exit $MIG_STATUS
            fi
          fi
